save_dir: 'saved_models/sdn_cayley_16kHz_lr0_01'
fig_dir:  'figures/sdn_cayley_16kHz_lr0_01'

sr: 16000
c: 343.0

source_index: 0

dataset_type: "simulated"

training:
  split_mode: border_train
  border_thickness: 2
  batch_size: 6
  accumulation_factor: 8
  val_accumulation_factor: 1
  n_epochs: 300
  learning_rate: 0.01            # lower than Householder: MLP benefits from smaller lr
  lambda_edc: 0.5
  lambda_edp: 1.0
  lambda_edr: 1.0

sdn:
  N: 6
  fir_order: 6
  alpha: 0.02

  junction_type: 'cayley'

  # Geometric input mode for the Cayley MLP junction.
  # Options:
  #   'mic_pos'        — mic coordinates only          (input_dim = 3,      ~742 params total)
  #   'dist_nodes_mic' — node-to-mic distances          (input_dim = N,      ~758 params total)
  #   'dist_full'      — all distances concatenated     (input_dim = 2N+1,   ~1316 params total)
  geom_mode: 'dist_full'

  # Hidden layer sizes of the MLP.
  # [16] → ~1316 total trainable parameters (recommended minimum).
  # [8]  → ~724 total parameters (very lean; output layer becomes near-linear).
  # [24] → ~1908 total parameters (more expressive, still compact).
  junction_hidden_dims: [16]
