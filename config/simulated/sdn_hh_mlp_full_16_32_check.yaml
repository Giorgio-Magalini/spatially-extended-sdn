save_dir: 'saved_models/sdn_householder_mlp_full_16_32'
fig_dir:  'figures/sdn_householder_mlp_full_16_32'

sr: 16000
c: 343.0

source_index: 0

dataset_type: "simulated"

training:
  split_mode: checkerboard
  batch_size: 8
  accumulation_factor: 4
  val_accumulation_factor: 1
  n_epochs: 300
  learning_rate: 0.01
  lambda_edc: 0.5
  lambda_edp: 1.0
  lambda_edr: 1.0

sdn:
  N: 6
  fir_order: 6
  alpha: 0.02

  junction_type: 'householder'
  use_mlp: true

  # Geometric input mode for the MLP junction.
  # Options:
  #   'mic_pos'        — mic coordinates only          (input_dim = 3)
  #   'dist_nodes_mic' — node-to-mic distances          (input_dim = N)
  #   'dist_full'      — all distances concatenated     (input_dim = 2N+1)
  geom_mode: 'dist_full'

  junction_hidden_dims: [16, 32]
