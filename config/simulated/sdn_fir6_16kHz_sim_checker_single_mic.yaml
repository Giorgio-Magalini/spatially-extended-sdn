save_dir: 'saved_models/sdn_fir6_16kHz_sim_checker_single_mic'
fig_dir:  'figures/sdn_fir6_16kHz_sim_checker_single_mic'

sr: 16000
c: 343.0
source_index: 0
dataset_type: "simulated"

training:
  split_mode: checkerboard    # identico al run di riferimento → val set invariato
  single_mic_baseline: true
  single_mic_local_idx: 0     # primo mic del train set checkerboard
  batch_size: 1
  accumulation_factor: 1
  val_accumulation_factor: 2
  n_epochs: 300
  learning_rate: 0.01
  lambda_edc: 0.5
  lambda_edp: 1.0
  lambda_edr: 1.0

sdn:
  N: 6
  junction_type: 'householder'
  fir_order: 6
  alpha: 0.22