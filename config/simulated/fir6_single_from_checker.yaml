save_dir: 'saved_models/fir6_single_from_checker'
fig_dir:  'figures/fir6_single_from_checker'

sr: 16000
c: 343.0
source_index: 0
dataset_type: "simulated"

training:
  split_mode: checkerboard_sparse    # identico al run di riferimento → val set invariato
  single_mic_baseline: true
  single_mic_local_idx: 0     # primo mic del train set checkerboard
  batch_size: 1
  accumulation_factor: 1
  test_batch_size: 48
  n_epochs: 300
  learning_rate: 0.01
  lambda_edc: 0.5
  lambda_edp: 1.0
  lambda_edr: 1.0

sdn:
  N: 6
  junction_type: 'householder'
  use_mlp: false
  fir_order: 6
  alpha: 0.22